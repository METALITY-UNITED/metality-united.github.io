<!DOCTYPE html>
<html lang="ja" prefix="og:http://ogp.me/ns#">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000">
  <meta name="description" content="{{ page.description }}">
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://metality.band{{ page.url }}" />
  <meta property="og:image" content="https://metality.band/images/logo-band-ogp.png" />
  <meta property="og:description" content="{{ page.description }}" />
  <meta property="og:site_name" content="METALITY UNITED" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@metality_united" />
  <link rel="stylesheet" href="https://unpkg.com/destyle.css@3.0.2/destyle.min.css">
  <link href="https://use.fontawesome.com/releases/v6.4.2/css/all.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/icon/favicon.ico">
  <link rel="icon" sizes="192x192" href="/icon/android-chrome-192x192.png">
</head>

<body>
  <div class="background has-flame-backdrop">
    {% include embers.html %}
    <div class="container">
      {% include header.html %}
    </div>

    <main class="container news-archive">
      <h1 class="news-archive-title">News</h1>
      <p class="news-archive-description">METALITY UNITEDからのお知らせ一覧です。</p>
      <ul class="news-list">
        {% for post in site.posts %}
        <li>
          <a href="{{ post.url }}">
            <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>
            <span class="news-title">{{ post.title }}</span>
            <span class="news-arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        {% endfor %}
      </ul>
    </main>

    {% include footer.html %}
  </div>
</body>

</html>
