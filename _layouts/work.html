<!DOCTYPE html>
<html lang="ja" prefix="og:http://ogp.me/ns#">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METALITY UNITED - {{ page.title }}</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000">
  <meta name="description" content="{{ page.description }}">
  <meta property="og:title" content="METALITY UNITED - {{ page.title }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://metality.band{{ page.url }}" />
  <meta property="og:image" content="https://metality.band/images/logo-band-ogp.png" />
  <meta property="og:description" content="{{ page.description }}" />
  <meta property="og:site_name" content="METALITY UNITED" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@metality_united" />

  <link rel="stylesheet" href="https://unpkg.com/destyle.css@3.0.2/destyle.min.css">
  <link href="https://use.fontawesome.com/releases/v6.4.2/css/all.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/icon/favicon.ico">
  <link rel="icon" sizes="192x192" href="/icon/android-chrome-192x192.png">
</head>

<body>
  <!-- 背景 -->
  <div class="background">
    <!--コンテンツ-->
    <div class="container">
      {% include header.html %}
    </div><!--コンテンツ一旦ここまで-->

    <!-- ビジュアル・タイトル-->
    <div class="music">
      <div class="container">
        <div class="music-introduction">
          <div class="music-copy">{{ page.copy }}</div>
          <div class="music-illustration">
            <img src="{{ page.imageUrl }}" {% if page.imageWidth %}width="{{ page.imageWidth }}" height="{{ page.imageHeight }}"{% endif %} alt="{{ page.title }}メインビジュアル" />
          </div>
          <div class="{{ page.titleClass }}">{{ page.title }}</div>
        </div>
      </div>
    </div>

    <div class="container">
      {{ content }}
    </div><!-- コンテンツここまで -->

    <!-- 動画リンク-->
    <div class="under-background">
      <!--コンテンツ-->
      <div class="container">
        <div class="youtube" id="youtube">
          {% assign videoId = page.youtube | split: '?' | first | split: '/' | last %}
          <div class="youtube-player" data-video-id="{{ videoId }}" role="button" tabindex="0"
            aria-label="{{ page.title }} - METALITY UNITED の動画再生">
            <img src="https://img.youtube.com/vi/{{ videoId }}/hqdefault.jpg" width="480" height="360"
              alt="{{ page.title }} サムネイル" />
            <span class="youtube-player-btn" aria-hidden="true"><i class="fa-solid fa-play"></i></span>
          </div>
        </div>
      </div>

      <!-- TOPに戻るアイコン -->
      <a href="#top">
        <div class="top-icon">
          <i class="fa-solid fa-circle-chevron-up iconsize"></i>
        </div>
      </a>

    </div><!-- 火の粉背景 -->

    {% include footer.html %}
  </div><!-- 背景ここまで -->

  <script>
    document.querySelectorAll('.youtube-player').forEach(function (player) {
      function play() {
        var id = player.getAttribute('data-video-id');
        var iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1';
        iframe.title = player.getAttribute('aria-label');
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.setAttribute('allowfullscreen', '');
        player.parentNode.replaceChild(iframe, player);
      }
      player.addEventListener('click', play);
      player.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          play();
        }
      });
    });
  </script>
</body>

</html>
