<!DOCTYPE html>
<html lang="ja" prefix="og:http://ogp.me/ns#">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000">
  <meta name="description" content="{{ page.description }}">
  <meta property="og:title" content="{{ page.title }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://metality.band{{ page.url }}" />
  <meta property="og:image" content="https://metality.band/images/logo-band-ogp.png" />
  <meta property="og:description" content="{{ page.description }}" />
  <meta property="og:site_name" content="METALITY UNITED" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@metality_united" />

  <link rel="stylesheet" href="https://unpkg.com/destyle.css@3.0.2/destyle.min.css">
  <script src="https://kit.fontawesome.com/d925e0b3e6.js" crossorigin="anonymous"></script>
  <link href="https://use.fontawesome.com/releases/v6.4.2/css/all.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/post.css">
  <link rel="icon" href="/icon/favicon.ico">
  <link rel="icon" sizes="192x192" href="/icon/android-chrome-192x192.png">
</head>

<body>
  <!-- 背景 -->
  <div class="background">
    <div class="container">
      {% include header.html %}
    </div>

    <header class="post-hero">
      <div class="container post-hero-content{% if page.image %} has-image{% endif %}">
        <div class="post-heading">
          <nav class="post-breadcrumb" aria-label="パンくずリスト">
            <a href="/#news">News</a>
            <span aria-hidden="true">/</span>
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
          </nav>
          <p class="post-eyebrow">NEWS UPDATE</p>
          <h1 class="post-title">{{ page.title }}</h1>
        </div>
        {% if page.image %}
        <div class="post-image">
          <img src="{{ page.image }}" alt="{{ page.title | escape }}の関連ビジュアル" />
        </div>
        {% endif %}
      </div>
    </header>

    <main class="container post-main">
      <article class="post-article">
        <div class="post-content">
          {{ content }}
        </div>
        <nav class="post-navigation" aria-label="記事ナビゲーション">
          <a class="post-back-link" href="/#news">
            <span aria-hidden="true">←</span>
            News一覧へ戻る
          </a>
        </nav>
      </article>
    </main>

    <!-- 投稿末尾のSNSリンク -->
    <section class="post-social container" aria-label="METALITY UNITEDのSNS">
      <p class="post-social-heading">FOLLOW METALITY UNITED</p>
      <ul class="social-links">
        <li>
          <a class="social-btn social-btn-x" href="https://twitter.com/metality_united" target="_blank" rel="noopener noreferrer" aria-label="METALITY UNITED の X (Twitter)">
            <i class="fa-brands fa-x-twitter"></i>
            @metality_united
          </a>
        </li>
        <li>
          <a class="social-btn social-btn-youtube" href="https://www.youtube.com/@METALITYUNITED" target="_blank" rel="noopener noreferrer" aria-label="METALITY UNITED の YouTube チャンネル">
            <i class="fa-brands fa-youtube"></i>
            @METALITYUNITED
          </a>
        </li>
      </ul>
    </section>

    {% include footer.html %}

  </div><!-- 背景ここまで -->
</body>

</html>
